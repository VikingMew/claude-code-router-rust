[package]
name = "ccr-router"
version = "0.1.0"
edition = "2024"

[dependencies]
ccr-types = { path = "../ccr-types" }
serde_json = "1.0.149"
tiktoken-rs = "0.11.0"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
dirs-next = "2.0"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread"] }
once_cell = "1.21"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread"] }
