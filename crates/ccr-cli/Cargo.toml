[package]
name = "ccr-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ccr"
path = "src/main.rs"

[lib]
name = "ccr_cli"
path = "src/lib.rs"

[dependencies]
ccr-config = { path = "../ccr-config" }
ccr-preset = { path = "../ccr-preset" }
ccr-app-core = { path = "../ccr-app-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
