[package]
name = "ccr-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
ccr-types = { path = "../ccr-types" }
serde_json = "1.0.149"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
lru = "0.18.0"
sha2 = "0.11.0"
tokio = { version = "1.52.1", features = ["full"] }
log = "0.4.29"
hex = "0.4.3"
