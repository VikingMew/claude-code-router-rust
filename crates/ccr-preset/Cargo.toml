[package]
name = "ccr-preset"
version = "0.1.0"
edition = "2024"

[lib]
name = "ccr_preset"
path = "src/lib.rs"

[dependencies]
ccr-types = { path = "../ccr-types" }
ccr-config = { path = "../ccr-config" }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1"
dirs-next = "2.0.0"

[dev-dependencies]
tempfile = "3"
