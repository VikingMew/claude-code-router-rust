[package]
name = "ccr-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ccr-server"
path = "src/main.rs"

[lib]
name = "ccr_server"
path = "src/lib.rs"

[dependencies]
ccr-types  = { path = "../ccr-types" }
ccr-config = { path = "../ccr-config" }
ccr-app-core = { path = "../ccr-app-core" }
ccr-router = { path = "../ccr-router" }
ccr-transformer = { path = "../ccr-transformer" }
ccr-sse = { path = "../ccr-sse" }
ccr-preset = { path = "../ccr-preset" }
ccr-agent = { path = "../ccr-agent" }
dirs-next = "2.0"
actix-web = "4.13.0"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
futures-util = "0.3"
bytes = "1"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
