[package]
name = "ccr-app-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ccr-config = { path = "../ccr-config" }
ccr-types = { path = "../ccr-types" }
chrono = "0.4"
dirs-next = "2.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
