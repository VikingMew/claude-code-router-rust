[package]
name = "ccr-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ccr-ui"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
ccr-types  = { path = "../ccr-types" }
ccr-config = { path = "../ccr-config" }
ccr-preset = { path = "../ccr-preset" }
ccr-transformer = { path = "../ccr-transformer" }
ccr-router = { path = "../ccr-router" }
ccr-app-core = { path = "../ccr-app-core" }
dirs-next = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tray-icon = "0.14"
image = "0.25"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
