[package]
name = "ccr-plugin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
log = "0.4"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
