name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check required docs
        run: ./scripts/check-docs-structure.sh
      - name: Rust fmt
        run: cargo fmt --check
      - name: Workspace tests
        run: cargo test --workspace
